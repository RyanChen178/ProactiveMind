name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn httpx websockets ruff

      - name: Lint with ruff
        run: ruff check mind/ events/ initiative/ extensions/ gateways/ tests/ app.py || true

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate config sample
        run: python -c "from mind.config import load_config; load_config('config.sample.toml')" || true
